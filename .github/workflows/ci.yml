name: CI

on:
  push:
    branches: [ "master", "v2" ]
  pull_request:
    branches: [ "master", "v2" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum version declared in go.mod and the current release.
        go: [ "1.25.x", "stable" ]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}
        cache-dependency-path: go.sum

    - name: Download modules
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -shuffle=on -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.go == 'stable'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  staticcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    # Keep the analysis toolchain explicit. Staticcheck releases support a
    # bounded set of Go versions and should not float with the test matrix.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.27.x"
        cache-dependency-path: go.sum

    - name: Install Staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.0

    - name: Staticcheck
      run: staticcheck ./...

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable
        cache-dependency-path: go.sum

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

    - name: govulncheck
      run: govulncheck ./...
